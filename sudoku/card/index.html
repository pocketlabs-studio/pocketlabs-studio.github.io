<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Anyone Can Sudoku — Daily puzzle</title>
    <style>
        :root {
            --bg: #0A0A0A;
            --surface: #141414;
            --text: #EAEAEA;
            --text-dim: #777;
            --accent: #4F8FFF;
            --border: #222;
            --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            line-height: 1.7;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 72px 24px 64px;
            text-align: center;
        }
        h1 {
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
        }
        .day {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 24px;
        }
        .day-meta {
            font-size: 1.25em;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        p {
            font-size: 0.95em;
            color: #ccc;
        }
        .day p + p { margin-top: 8px; }
        .lead { margin-bottom: 24px; }
        .store-button {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 999px;
            transition: opacity 0.2s;
        }
        .store-button:hover { opacity: 0.85; }
        footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        footer p {
            font-size: 0.82em;
            color: var(--text-dim);
        }
        @media (max-width: 600px) {
            .container { padding: 48px 16px 48px; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1 id="app-name">Anyone Can Sudoku</h1>
        <section id="card-day" class="day" hidden>
            <p class="day-meta"><span id="card-date"></span> · <span id="card-level"></span></p>
            <p id="card-line"></p>
            <p id="card-how"></p>
        </section>
        <p id="intro" class="lead">A sudoku with no ads and no pop-ups. Everyone gets the same three puzzles each day.</p>
        <p><a id="store-link" class="store-button" href="https://apps.apple.com/app/id6820589149">Download on the App Store</a></p>
    </main>

    <footer>
        <p>&copy; 2026 PocketLabs. All rights reserved.</p>
    </footer>

    <script>
        const CARD_FIRST_DATE = '2026-01-01';
        const CARD_LAST_DATE = '2035-12-31';
        const CARD_SLOTS = ['easy', 'normal', 'hard'];
        const CARD_LANGS = ['ko', 'ja', 'en'];
        const CARD_DATE_SHAPE = /^(\d{4})-(\d{2})-(\d{2})$/;
        const CARD_MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const CARD_TEXT = {
            ko: {
                title: '누구나 스도쿠 — 오늘의 한 판',
                appName: '누구나 스도쿠',
                intro: '광고도, 팝업도 없는 스도쿠예요. 날마다 같은 세 판을 모두가 함께 풀어요.',
                store: 'App Store에서 받기',
                level: { easy: '쉬움', normal: '보통', hard: '어려움' },
                date: (d) => `${d.year}년 ${d.month}월 ${d.day}일`,
                line: (dateText) => `누구나 스도쿠의 ${dateText} 「오늘의 한 판」이에요.`,
                how: (levelText) => `앱을 열고 「기록」 탭 → 달력에서 그 날짜를 고른 뒤 「${levelText}」의 「풀기」를 누르면 같은 판을 풀 수 있어요.`,
            },
            en: {
                title: 'Anyone Can Sudoku — Daily puzzle',
                appName: 'Anyone Can Sudoku',
                intro: 'A sudoku with no ads and no pop-ups. Everyone gets the same three puzzles each day.',
                store: 'Download on the App Store',
                level: { easy: 'Easy', normal: 'Medium', hard: 'Hard' },
                date: (d) => `${CARD_MONTHS_EN[d.month - 1]} ${d.day}, ${d.year}`,
                line: (dateText) => `It's the “Today's puzzle” for ${dateText} in Anyone Can Sudoku.`,
                how: (levelText) => `You can open the app, go to the “Records” tab, pick that date on the calendar, and tap “Play” under “${levelText}” to solve the same puzzle.`,
            },
            ja: {
                title: 'だれでもナンプレ — 今日の一問',
                appName: 'だれでもナンプレ',
                intro: '広告もポップアップもないナンプレです。毎日、みんなが同じ3問を解きます。',
                store: 'App Storeからダウンロード',
                level: { easy: 'かんたん', normal: 'ふつう', hard: 'むずかしい' },
                date: (d) => `${d.year}年${d.month}月${d.day}日`,
                line: (dateText) => `だれでもナンプレの${dateText}の「今日の一問」です。`,
                how: (levelText) => `アプリを開いて「記録」タブ → カレンダーでその日付を選び、「${levelText}」の「解く」を押すと、同じ問題を解けます。`,
            },
        };

        function parseCardQuery(search) {
            const params = new URLSearchParams(search);
            const dateText = params.get('d');
            const slot = params.get('s');
            if (dateText === null || slot === null || !CARD_SLOTS.includes(slot)) {
                return null;
            }
            const match = CARD_DATE_SHAPE.exec(dateText);
            if (match === null || dateText < CARD_FIRST_DATE || dateText > CARD_LAST_DATE) {
                return null;
            }
            const year = Number(match[1]);
            const month = Number(match[2]);
            const day = Number(match[3]);
            const real = new Date(Date.UTC(year, month - 1, day));
            if (real.getUTCFullYear() !== year || real.getUTCMonth() !== month - 1 || real.getUTCDate() !== day) {
                return null;
            }
            return { date: { year, month, day }, slot };
        }

        function pickLang(languages) {
            for (const tag of languages) {
                const primary = String(tag).split('-')[0].toLowerCase();
                if (CARD_LANGS.includes(primary)) {
                    return primary;
                }
            }
            return 'en';
        }

        function browserLanguages(nav) {
            if (Array.isArray(nav.languages) && nav.languages.length > 0) {
                return nav.languages;
            }
            return nav.language ? [nav.language] : [];
        }

        function renderCardPage(doc, lang, query) {
            const text = CARD_TEXT[lang];
            doc.documentElement.lang = lang;
            doc.title = text.title;
            doc.getElementById('app-name').textContent = text.appName;
            doc.getElementById('intro').textContent = text.intro;
            doc.getElementById('store-link').textContent = text.store;
            if (query === null) {
                return;
            }
            const dateText = text.date(query.date);
            const levelText = text.level[query.slot];
            doc.getElementById('card-date').textContent = dateText;
            doc.getElementById('card-level').textContent = levelText;
            doc.getElementById('card-line').textContent = text.line(dateText);
            doc.getElementById('card-how').textContent = text.how(levelText);
            doc.getElementById('card-day').hidden = false;
            doc.getElementById('intro').hidden = true;
        }

        renderCardPage(document, pickLang(browserLanguages(navigator)), parseCardQuery(location.search));
    </script>
</body>
</html>
